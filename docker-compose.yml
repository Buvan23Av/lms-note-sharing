
services:
  mongodb:
    image: mongo:7.0
    container_name: lms_mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: lms_db
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  neo4j:
    image: neo4j:5.15-community
    container_name: lms_neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/password123
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
    restart: unless-stopped

volumes:
  mongodb_data:
  neo4j_data:
